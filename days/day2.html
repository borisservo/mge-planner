<div class="card-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <div>
        <h3 style="margin:0;">Stage 2: Hero Growth</h3>
        <p style="margin:0; font-size: 0.7rem; color: #888; font-style: italic;">Empower Your Champions</p>
    </div>
    <div class="subtotal-text">Subtotal: <span id="sub-st2">0</span></div>
</div>

<div style="background: rgba(155, 89, 182, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(155, 89, 182, 0.2); margin-bottom: 20px;">
    <p style="margin:0; font-size: 0.75rem; text-align: center;"><b>Objective:</b> Accumulate points by upgrading heroes and crafting gear.</p>
</div>

<h4 style="color: #9b59b6; font-size: 0.8rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px;">HERO UPGRADES</h4>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
    <div class="input-group">
        <label style="font-size: 0.65rem; color: #9b59b6;  display: block; margin-bottom: 4px;">EPIC EXCLUSIVE MEDAL (500)</label>
        <input type="number" id="h-epic-medal" value="0" oninput="calculate()" style="width:100%; background:#1a1a1a; color:#fff; border:1px solid #333; padding:8px; border-radius:4px;">
    </div>
    <div class="input-group">
        <label style="font-size: 0.65rem; color: #e67e22; display: block; margin-bottom: 4px;">LEG. EXCLUSIVE MEDAL (2,500)</label>
        <input type="number" id="h-leg-medal" value="0" oninput="calculate()" style="width:100%; background:#1a1a1a; color:#fff; border:1px solid #333; padding:8px; border-radius:4px;">
    </div>
    <div class="input-group">
        <label style="font-size: 0.65rem; color: #9b59b6;  display: block; margin-bottom: 4px;">UNIV. EPIC SKILL (350)</label>
        <input type="number" id="h-epic-skill" value="0" oninput="calculate()" style="width:100%; background:#1a1a1a; color:#fff; border:1px solid #333; padding:8px; border-radius:4px;">
    </div>
    <div class="input-group">
        <label style="font-size: 0.65rem; color: #e67e22; display: block; margin-bottom: 4px;">UNIV. LEG. SKILL (2,000)</label>
        <input type="number" id="h-leg-skill" value="0" oninput="calculate()" style="width:100%; background:#1a1a1a; color:#fff; border:1px solid #333; padding:8px; border-radius:4px;">
    </div>
</div>

<h4 style="color: #9b59b6; font-size: 0.8rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px;">GEAR CRAFTING</h4>
<div style="display: grid; grid-template-columns: 1fr; gap: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px; border-radius: 5px; border: 1px solid #333;">
        <label style="font-size: 0.75rem; color: #3498db; margin:0;">Craft Rare Gear (1,000)</label>
        <input type="number" id="g-rare" value="0" oninput="calculate()" style="width: 80px; text-align: right; background:#000; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;">
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px; border-radius: 5px; border: 1px solid #333;">
        <label style="font-size: 0.75rem; color: #9b59b6; margin:0;">Craft Epic Gear (5,000)</label>
        <input type="number" id="g-epic" value="0" oninput="calculate()" style="width: 80px; text-align: right; background:#000; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;">
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 10px; border-radius: 5px; border: 1px solid #333;">
        <label style="font-size: 0.75rem; color: #e67e22; margin:0;">Craft Legendary Gear (15,000)</label>
        <input type="number" id="g-leg" value="0" oninput="calculate()" style="width: 80px; text-align: right; background:#000; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;">
    </div>
    <div style="background: #222; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333;">
        <label style="color: var(--blue); display: block; margin-bottom: 5px;">Iron Meteorite Quantity</label>
        <input type="number" id="ironMeteorite" value="0" oninput="calculate()" placeholder="How many meteorites do you have?" style="width: 100%; padding: 8px; background: #000; color: #fff; border: 1px solid #444; border-radius: 4px;">

        <p style="margin: 8px 0 0 0; font-size: 0.85rem; color: #aaa;">
            Craftable Pieces: <b id="craftedPieces" style="color: var(--gold);">0</b>
        </p>
    </div>
    <div style="background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333;">
        <h4 style="color: #ccc; margin-top: 0; margin-bottom: 15px;">Forge Speedups & Time</h4>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label style="color: var(--blue);">Total Speedups (Minutes)</label>
                <input type="number" id="forgeSpeedups" value="0" oninput="calculate()" placeholder="e.g. 1200" style="width: 100%; padding: 8px; background: #000; color: #fff; border: 1px solid #444; border-radius: 4px;">
            </div>
            <div>
                <label style="color: var(--blue);">Time per Forge (Minutes)</label>
                <input type="number" id="forgeTime" value="0" oninput="calculate()" placeholder="e.g. 60" style="width: 100%; padding: 8px; background: #000; color: #fff; border: 1px solid #444; border-radius: 4px;">
            </div>
        </div>

        <p style="margin: 10px 0 0 0; font-size: 0.85rem; color: #aaa;">
            Extra Forges via Speedups: <b id="extraForges" style="color: var(--gold);">0</b>
        </p>
    </div>

</div>
