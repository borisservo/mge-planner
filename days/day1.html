<div class="card">
    <div class="card-header">
        <h3>Tribal Raid (Day 1)</h3>
        <div style="color:var(--gold)">Subtotal: <span id="sub-st1">0</span></div>
    </div>

    <label>Tribe Level</label>
    <select id="tribeTier" onchange="calculate()">
        <option value="300">Lvl 29-30 (300 pts)</option>
        <option value="260">Lvl 25-28 (260 pts)</option>
        <option value="220">Lvl 21-24 (220 pts)</option>
        <option value="180">Lvl 17-20 (180 pts)</option>
        <option value="150">Lvl 13-16 (150 pts)</option>
        <option value="100">Lvl 9-12 (100 pts)</option>
        <option value="80">Lvl 5-8 (80 pts)</option>
        <option value="50">Lvl 1-4 (50 pts)</option>
    </select>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:15px;">
        <div>
            <label>Total Stamina</label>
            <input type="number" id="staminaTotal" value="1000" oninput="calculate()">
        </div>
        <div>
            <label>Cost per Kill</label>
            <input type="number" id="staminaCost" value="5" oninput="calculate()">
        </div>
    </div>

    <div class="prediction">
        <span>Possible Kills: <b id="resKills" style="color:var(--gold)">0</b></span><br>
        <span style="font-size: 1.2rem;">MGE Points: <b id="resPoints" style="color:#00ff00;">0</b></span>
    </div>
</div>
