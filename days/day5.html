<div class="card">
    <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h3>Sprint Training (Day 5)</h3>
        <div class="subtotal-text">Subtotal: <span id="sub-st5">0</span></div>
    </div>

    <div style="background: #222; padding: 15px; border-radius: 8px; margin-top: 15px;">
        <label for="researchBonus" style="font-size: 0.7rem; color: var(--blue);">Training Research Bonus (%)</label>
        <input type="number" id="researchBonus" value="0" oninput="calculate()">

        <label for="sp-target" style="font-size: 0.7rem; color: var(--blue); margin-top: 10px; display: block;">Target Unit Level</label>
        <select id="sp-target" onchange="calculate()" style="width:100%; background:#000; color:gold; border:1px solid #444; padding:5px;">
            <option value="7">T7 (100 pts)</option>
            <option value="6">T6 (50 pts)</option>
            <option value="5">T5 (20 pts)</option>
        </select>
    </div>

    <div id="sprint-calc" style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div data-lvl="7">
            <label style="font-size:0.6rem;">T7 Base Min</label>
            <input type="number" class="u-min" value="33" oninput="calculate()">
            <label style="font-size:0.6rem;">T7 Base Sec</label>
            <input type="number" class="u-sec" value="36" oninput="calculate()">
        </div>
        <div>
            <label style="font-size:0.6rem;">Speedups Available (D/H/M/S)</label>
            <input type="number" id="sp-d" placeholder="Days" oninput="calculate()">
            <input type="number" id="sp-h" placeholder="Hours" oninput="calculate()">
            <input type="number" id="sp-m" placeholder="Mins" oninput="calculate()">
            <input type="number" id="sp-s" placeholder="Secs" oninput="calculate()">
        </div>
    </div>

    <div class="prediction" style="text-align: center; margin-top: 15px;">
        <div>Units: <b id="sp-res-qty">0</b></div>
        <div>Points: <b id="sp-res-pts">0</b></div>
        <label style="font-size: 0.8rem; margin-top: 10px; display: block; cursor: pointer;">
            <input type="checkbox" id="linkToDay6"> Send to Day 6
        </label>
    </div>
</div>
