<div class="card-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <div>
        <h3 style="margin:0; color: #3498db;">Stage 5: Unit Training</h3>
        <p style="margin:0; font-size: 0.7rem; color: #888; font-style: italic;">A Tactical Void</p>
    </div>
    <div class="subtotal-text">Subtotal: <span id="sub-st5">0</span></div>
</div>

<div style="background: rgba(155, 89, 182, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(155, 89, 182, 0.2); margin-bottom: 20px;">
    <p style="margin:0; font-size: 0.75rem; text-align: center;"><b>Objective:</b> Train units to earn points.</p>
</div>

<h4 style="color: #3498db; font-size: 0.8rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: center;">
    TRAINING CALCULATOR
    <label style="font-size:0.7rem; color:#f1c40f; display:flex; align-items:center; gap:5px; cursor:pointer;">
        <input type="checkbox" id="d5-to-d6" onchange="calculate()"> Send Power to D6
    </label>
</h4>

<div style="background: #1a1a1a; border: 1px solid #3498db; border-radius: 6px; padding: 12px; margin-bottom: 20px;">
    <div style="display: grid; grid-template-columns: 1fr 1.2fr 1.8fr; gap: 10px; margin-bottom: 15px;">
        <div>
            <label style="font-size: 0.6rem; color: #888; display:block; margin-bottom:3px;">UNIT LEVEL</label>
            <select id="tc-lvl" onchange="calculate()" style="width:100%; background:#000; color:#fff; border:1px solid #444; padding:8px; border-radius:4px;">
                <option value="9">Level 9</option>
                <option value="8">Level 8</option>
                <option value="7">Level 7</option>
                <option value="6">Level 6</option>
                <option value="5">Level 5</option>
            </select>
        </div>
        <div>
            <label style="font-size: 0.6rem; color: #888; display:block; margin-bottom:3px;">TIME / 1 UNIT</label>
            <div style="display:flex; gap:5px;">
                <input type="number" id="tc-min" placeholder="Min" oninput="calculate()" style="width:50%; background:#000; color:#fff; border:1px solid #444; padding:8px; border-radius:4px;">
                <input type="number" id="tc-sec" placeholder="Sec" oninput="calculate()" style="width:50%; background:#000; color:#fff; border:1px solid #444; padding:8px; border-radius:4px;">
            </div>
        </div>
        <div>
            <label style="font-size: 0.6rem; color: #888; display:block; margin-bottom:3px;">TOTAL SPEEDUPS</label>
            <div style="display:flex; gap:5px;">
                <input type="number" id="tc-spd" placeholder="Days" oninput="calculate()" style="width:33%; background:#000; color:#fff; border:1px solid #444; padding:8px; border-radius:4px;">
                <input type="number" id="tc-sph" placeholder="Hrs" oninput="calculate()" style="width:33%; background:#000; color:#fff; border:1px solid #444; padding:8px; border-radius:4px;">
                <input type="number" id="tc-spm" placeholder="Min" oninput="calculate()" style="width:33%; background:#000; color:#fff; border:1px solid #444; padding:8px; border-radius:4px;">
            </div>
        </div>
    </div>

    <div style="background:#000; padding:10px; border-radius:4px; display:flex; justify-content:space-between; align-items:center; border: 1px solid #222;">
        <span style="font-size: 0.75rem; color: #888;">Expected Output:</span>
        <div style="text-align: right;">
            <span style="font-size: 0.8rem; color: #fff; margin-right: 15px;"><b id="tc-units" style="color:#3498db; font-size:1rem;">0</b> Units</span>
            <span style="font-size: 0.8rem; color: #fff;"><b id="tc-pts" style="color:#f1c40f; font-size:1rem;">0</b> Pts</span>
        </div>
    </div>
</div>
