<div class="card">
    <div class="card-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 style="margin:0;">Power Boost (Day 6)</h3>
        <div class="subtotal-text">Subtotal: <span id="sub-st6">0</span></div>
    </div>

    <div style="background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333;">
        <label style="color: var(--blue); display: block; margin-bottom: 10px;">Power Increase Points</label>

        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.7rem; color: #888;">Buildings Power Up</label>
            <input type="number" class="mge-val" data-pts="2" placeholder="Enter power gained" oninput="calculate()">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.7rem; color: #888;">Technology Power Up</label>
            <input type="number" class="mge-val" data-pts="2" placeholder="Enter power gained" oninput="calculate()">
        </div>
    </div>

    <div style="margin-top: 20px; padding: 15px; background: #111; border-radius: 8px; font-size: 0.8rem; color: #888;">
        <p><b style="color: var(--gold);">Note:</b> Training points can be linked from the Day 5 Sprint calculator using the checkbox.</p>
        <p><b style="color: var(--blue);">Formula:</b> Every 1 point of Power Gained = 2 MGE Points.</p>
    </div>
</div>
