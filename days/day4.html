<div class="card-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
    <div>
        <h3 style="margin:0;">Stage 4: Race Against Time</h3>
        <p style="margin:0; font-size: 0.7rem; color: #888; font-style: italic;">Strategic Delay</p>
    </div>
    <div class="subtotal-text">Subtotal: <span id="sub-st4">0</span></div>
</div>

<div style="background: rgba(155, 89, 182, 0.1); padding: 12px; border-radius: 8px; border: 1px solid rgba(155, 89, 182, 0.2); margin-bottom: 20px;">
    <p style="margin:0; font-size: 0.75rem; text-align: center;"><b>Objective:</b> Upgrade rings, use speed-ups and complete fine crafts.</p>
</div>

<h4 style="color: #e74c3c; font-size: 0.8rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px;">SIGNET RINGS UPGRADE</h4>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
    <div class="input-group">
        <label style="font-size: 0.65rem; color: #888; display: block; margin-bottom: 4px;">COPPER SAND (400)</label>
        <input type="number" id="r-copper" value="0" oninput="calculate()" style="width:100%; background:#1a1a1a; color:#fff; border:1px solid #333; padding:8px; border-radius:4px;">
    </div>
    <div class="input-group">
        <label style="font-size: 0.65rem; color: #888; display: block; margin-bottom: 4px;">SILVER SAND (1,000)</label>
        <input type="number" id="r-silver" value="0" oninput="calculate()" style="width:100%; background:#1a1a1a; color:#fff; border:1px solid #333; padding:8px; border-radius:4px;">
    </div>
    <div class="input-group">
        <label style="font-size: 0.65rem; color: #888; display: block; margin-bottom: 4px;">FINE GOLD (3,000)</label>
        <input type="number" id="r-gold" value="0" oninput="calculate()" style="width:100%; background:#1a1a1a; color:#fff; border:1px solid #333; padding:8px; border-radius:4px;">
    </div>
    <div class="input-group">
        <label style="font-size: 0.65rem; color: #888; display: block; margin-bottom: 4px;">METEOR STEEL (20,000)</label>
        <input type="number" id="r-meteor" value="0" oninput="calculate()" style="width:100%; background:#1a1a1a; color:#fff; border:1px solid #333; padding:8px; border-radius:4px;">
    </div>
</div>

<h4 style="color: #e74c3c; font-size: 0.8rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px;">SPEED-UPS (TOTAL MINUTES)</h4>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
    <div style="background: #1a1a1a; padding: 10px; border-radius: 5px; border: 1px solid #333;">
        <label style="font-size: 0.70rem; color: #3498db; display:block; margin-bottom: 5px;">Building (30 pts/min)</label>
        <input type="number" id="sp-build" value="0" oninput="calculate()" style="width: 100%; background:#000; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;">
    </div>
    <div style="background: #1a1a1a; padding: 10px; border-radius: 5px; border: 1px solid #333;">
        <label style="font-size: 0.70rem; color: #2ecc71; display:block; margin-bottom: 5px;">Research (30 pts/min)</label>
        <input type="number" id="sp-research" value="0" oninput="calculate()" style="width: 100%; background:#000; color:#fff; border:1px solid #444; padding:5px; border-radius:4px;">
    </div>
</div>

<h4 style="color: #e74c3c; font-size: 0.8rem; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px;">FINE CRAFTING</h4>
<div style="display:flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 12px; border-radius: 5px; border: 1px solid #333;">
    <span style="font-size: 0.8rem; color: #e67e22;">Complete Fine Craft (2,000 pts)</span>
    <input type="number" id="c-fine" value="0" oninput="calculate()" style="width:100px; text-align:right; background:#000; color:#fff; border:1px solid #333; padding:5px; border-radius:4px;">
</div>
